packages:
  - "apps/*"
  - "packages/*"

# Les packages du workspace sont référencés explicitement en `workspace:*`.
linkWorkspacePackages: false

# Versions partagées déclarées une seule fois (doc 10).
# Les paquets `expo-*` sont volontairement absents : leurs versions sont
# pilotées par `npx expo install`, qui les aligne sur le SDK.
catalog:
  # Socle
  typescript: 6.0.3
  "@types/node": ^24.13.3
  tsx: ^4.23.1
  zod: ^4.4.3

  # Qualité
  # Biome remplace ESLint + Prettier : un seul binaire, une seule
  # configuration, lancé depuis la racine (doc 09 D19).
  "@biomejs/biome": ^2.5.6
  knip: ^6.30.0
  lefthook: ^2.1.10
  vitest: ^4.1.10

  # Auth — une seule instance côté API, un client par plateforme (doc 04).
  # `@better-auth/expo` s'installe des deux côtés : le plugin serveur et le
  # plugin client viennent du même paquet. C'est la seule exception à la règle
  # « les paquets liés à Expo passent par npx expo install » — il n'embarque
  # aucun natif, ce sont `expo-secure-store` et `expo-network` qui en ont.
  better-auth: ^1.6.25
  "@better-auth/expo": ^1.6.25

  # E-mails transactionnels (doc 09 D20). Le SDK est chargé paresseusement par
  # `apps/api/src/lib/mailer.ts` : sans `RESEND_API_KEY`, il n'est jamais importé.
  resend: ^6.14.0

  # API
  hono: ^4.12.32
  "@hono/node-server": ^2.0.12
  "@hono/zod-openapi": ^1.5.1

  # Données
  prisma: ^7.9.1
  # Le client généré importe `@prisma/client/runtime/client` : le paquet reste
  # une dépendance runtime en v7, même si l'import direct de `PrismaClient`
  # depuis "@prisma/client" n'existe plus.
  "@prisma/client": ^7.9.1
  "@prisma/adapter-pg": ^7.9.1
  dotenv: ^17.4.2

  # Front
  # React est épinglé **exactement**, pas en plage : pnpm indexe les paquets à
  # peer React (react-query, react-dom…) par la version de React résolue. Deux
  # versions de React produisent deux instances de react-query, donc deux
  # contextes distincts — le QueryClientProvider du mobile alimente l'un et les
  # hooks de api-client lisent l'autre, d'où « No QueryClient set ».
  # La valeur est celle qu'impose Expo SDK 57 (`expo install --check`).
  react: 19.2.3
  react-dom: 19.2.3
  "@types/react": ^19.2.18
  "@tanstack/react-query": ^5.101.4
  # Glisser-déposer de l'éditeur de routines (doc 05), **web uniquement**.
  # dnd-kit plutôt que react-dnd ou une solution HTML5 native : il fournit une
  # alternative clavier complète, ce qui est la condition de l'objectif WCAG
  # 2.1 AA — un éditeur qui ne se pilote qu'à la souris n'est pas accessible.
  "@dnd-kit/core": ^6.3.1
  "@dnd-kit/sortable": ^10.0.0
  "@dnd-kit/utilities": ^3.2.2
  # `tailwindcss` est absent volontairement : le web est en Tailwind 4 et le
  # mobile en Tailwind 3 (NativeWind v4 stable), décalage assumé — doc 10.
  "@types/react-dom": ^19.2.4

  # shadcn/ui — `packages/ui`, web uniquement (D24).
  # Ces versions sont celles que le CLI shadcn résout ; il les écrit en dur
  # dans le `package.json` du paquet à chaque `add`. Après un `shadcn add` qui
  # tire une nouvelle dépendance, la remonter ici et remettre `catalog:`.
  "class-variance-authority": ^0.7.1
  clsx: ^2.1.1
  "tailwind-merge": ^3.6.0
  "tw-animate-css": ^1.4.0
  # `radix-ui` est le paquet unifié (base `radix`), pas les anciens
  # `@radix-ui/react-*` un par primitive.
  "radix-ui": ^1.6.7
  "lucide-react": ^1.28.0
  "next-themes": ^0.4.6
  # Notifications éphémères. Déclaré dans `packages/ui` — qui porte
  # `sonner.tsx` — **et** dans `apps/web`, qui appelle `toast()` depuis ses
  # features sans passer par la primitive.
  sonner: ^2.0.7
  # i18n du web (D29). Le mobile aura le sien : next-intl est propre à Next.
  "next-intl": ^4.5.5
  # Graphiques du tableau de bord (doc 05), **web uniquement**. Déclaré dans
  # `packages/ui` — qui porte `chart.tsx` — **et** dans `apps/web`, qui compose
  # les graphiques et importe donc `Bar`, `BarChart` et consorts directement.
  recharts: ^3.8.0
  # Découpage en semaines et bornes de mois du `contribution-graph` (Kibo UI,
  # doc 05). Déclaré uniquement dans `packages/ui`, qui porte le composant —
  # `apps/web` ne l'importe jamais directement.
  "date-fns": ^4.4.0
  # Dépendance d'exécution, pas seulement un CLI : `globals.css` fait
  # `@import "shadcn/tailwind.css"`. La retirer casse le build du CSS.
  shadcn: ^4.16.1

  # Scripts d'installation autorisés. pnpm 11 les bloque par défaut : chaque
  # entrée est une décision, pas une formalité.
allowBuilds:
  # Moteurs Prisma et CLI : indispensables aux migrations et à la génération.
  "@prisma/engines": true
  prisma: true
  # Binaire natif d'esbuild, utilisé par tsx et Vitest.
  esbuild: true
  # Optimisation d'images de Next.js (binaire natif libvips).
  sharp: true
  # Lefthook télécharge et lie son binaire Go au postinstall : sans ce script,
  # `lefthook install` n'a rien à exécuter et les hooks ne sont jamais posés.
  lefthook: true
  # Tirés par `next-intl`, qui les embarque pour son plugin Next — celui qu'on
  # n'utilise pas, la langue venant du profil et non de l'URL (D29). Refusés
  # explicitement plutôt que laissés en suspens : un script ignoré fait sortir
  # `pnpm install` en erreur, et `pnpm exec` refuse alors de démarrer.
  "@swc/core": false
  "@parcel/watcher": false

# Failles hautes tirées transitivement par Next 16.2.12, que `pnpm audit`
# bloque en CI. Les deux sont des montées de patch, sans rupture d'API :
#   - postcss < 8.5.18 : lecture de fichier arbitraire via `sourceMappingURL`
#     dans un commentaire CSS (GHSA-6g55-p6wh-862q, GHSA-r28c-9q8g-f849)
#   - sharp < 0.35.0 : vulnérabilités héritées de libvips (GHSA-f88m-g3jw-g9cj)
# À retirer dès que Next relève ses propres bornes.
#
# S'ajoute `brace-expansion` : déni de service par tableaux intermédiaires non
# bornés (GHSA-rgw5-rvv9-x895), tiré par les `glob`/`minimatch` de la chaîne
# Expo. L'avis a été publié entre deux passages de CI, sans le moindre
# changement de dépendance de notre côté. La borne ne vise que la plage
# vulnérable : les versions 1.x et 2.x, encore présentes ailleurs dans l'arbre,
# ne le sont pas et une montée forcée y serait une rupture d'API gratuite.
#
# Même histoire pour `fast-uri` : confusion d'hôte via un antislash en tête
# d'autorité (GHSA-7p8r-x3mc-p8w7), publié le 2026-08-03 et tiré par l'`ajv` de
# commitlint, de Prisma et de Better Auth — 28 chemins, aucun à nous. Correctif
# de patch, la borne suit celle de l'avis.
overrides:
  postcss: ^8.5.18
  sharp: ^0.35.0
  "brace-expansion@>=4.0.0 <5.0.9": ">=5.0.9"
  "fast-uri@>=3.0.0 <3.1.5": ">=3.1.5"

minimumReleaseAgeExclude:
  - "@types/react@19.2.18"
  - "@types/react-dom@19.2.4"
  - knip@6.30.0
